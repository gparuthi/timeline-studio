<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Timeline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0f1418; color: #dfebf2; font-family: system-ui, -apple-system, sans-serif; }
      .msg { max-width: 520px; margin: 18vh auto; padding: 0 24px; text-align: center; line-height: 1.5; }
      .msg a { color: #8fc7dd; }
    </style>
  </head>
  <body>
    <p class="msg">Loading timeline…</p>
    <script src="timeline-renderer.js"></script>
    <script>
      // The whole timeline lives in the URL fragment (see TimelineText.encodeLink),
      // so this page is static and the text never reaches a server.
      // Rendering replaces the document, so a new fragment arriving in this
      // same tab (a second link tapped on a phone) needs a fresh load.
      window.addEventListener("hashchange", () => location.reload());
      (async () => {
        const message = document.querySelector(".msg");
        try {
          const text = await TimelineText.decodeLink(location.hash);
          if (!text)
            throw new Error("There is no timeline in this link. Make one in the studio and choose “Open link”.");
          const html = TimelineText.render(TimelineText.parse(text));
          // A #text= link decodes at once, while this page is still being
          // parsed, and document.open() is ignored then: the timeline would
          // be appended under "Loading timeline…" instead of replacing it.
          if (document.readyState === "loading")
            await new Promise((done) => document.addEventListener("DOMContentLoaded", done, { once: true }));
          document.open();
          document.write(html);
          document.close();
          // document.open() dropped every window listener; a second link tapped
          // into this tab must still trigger a fresh load.
          window.addEventListener("hashchange", () => location.reload());
          // Tapping a card opens the studio on that line, like the live preview;
          // not during a run (a stray tap mid-workout), and not on a card's
          // "3 notes" hint, which folds its notes.
          document.head.insertAdjacentHTML("beforeend", "<style>[data-line]{cursor:pointer}</style>");
          document.addEventListener("click", (event) => {
            if (event.target.closest("a, summary") || document.body.classList.contains("run-active")) return;
            const target = event.target.closest("[data-line]");
            if (target) location.href = `./?line=${target.dataset.line}${location.hash}`;
          });
          document.body.insertAdjacentHTML(
            "beforeend",
            `<a class="edit-pill" href="./${location.hash}" style="position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:28;padding:9px 14px;border-radius:999px;background:#143e55;color:#fff;font:600 13px system-ui,-apple-system,sans-serif;text-decoration:none;opacity:.85;box-shadow:0 4px 18px #0004">✎ Edit</a>`,
          );
          // A routine's ready card has its own Edit beside Start; the pill
          // hides while that card is on screen and moves into the run bar
          // during a run, so it never sits on a step.
          const readyEdit = document.querySelector(".ready-edit");
          if (readyEdit) {
            readyEdit.hidden = false;
            readyEdit.addEventListener("click", () => (location.href = `./${location.hash}`));
            document.head.insertAdjacentHTML(
              "beforeend",
              "<style>body.run-routine:not(.run-docked):not(.run-active)>.edit-pill{display:none}</style>",
            );
          }
        } catch (error) {
          message.innerHTML = "";
          message.append(error.message, document.createElement("br"));
          const link = document.createElement("a");
          link.href = "./";
          link.textContent = "Open Timeline Studio";
          message.append(link);
        }
      })();
    </script>
  </body>
</html>
